<!doctype html>
<html lang="sk">
<head>

  <title>Pre teba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--bg:#260711;--surface:#46101f;--surface2:#62172c;--accent:#a72a4a;--bright:#e55278;--text:#fff8f8;--muted:#dfc6cb;--good:#82dfad;--bad:#ff8498;--shadow:0 16px 35px #10020788}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#62172c,transparent 32%),var(--bg);font-family:Poppins,system-ui,sans-serif;color:var(--text);min-height:100svh}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.screen{width:min(100%,540px);min-height:100svh;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));animation:enter .36s ease}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-weight:700;letter-spacing:.4px;font-size:18px;user-select:none}.sound,.icon-btn{width:43px;height:43px;border-radius:50%;background:#ffffff13;display:grid;place-items:center;font-size:19px}.back{margin-right:12px}.hero{padding-top:8vh}.eyebrow{color:#f2a8b9;font-size:13px;text-transform:uppercase;letter-spacing:1.3px;font-weight:600}.hero h1,h1{font-size:31px;line-height:1.18;margin:8px 0 12px}.lead,p{color:var(--muted);line-height:1.65;font-size:14px}.input{background:#ffffff10;border:1px solid #ffffff1e;border-radius:16px;color:white;padding:16px;width:100%;outline:0;margin:25px 0 12px}.input:focus{border-color:var(--bright)}.primary,.choice,.menu-card,.secondary{border-radius:17px;padding:15px 18px;background:linear-gradient(135deg,var(--accent),#7f1c36);font-weight:600;box-shadow:0 8px 22px #15030a66;transition:.2s transform,.2s filter}.primary:active,.choice:active,.menu-card:active{transform:scale(.97)}.primary{width:100%;letter-spacing:.3px}.secondary{background:#ffffff12;width:100%;margin-top:10px}.menu-grid{display:grid;gap:13px}.menu-card{text-align:left;background:linear-gradient(135deg,#571225,#3e0d1b);min-height:108px;position:relative;overflow:hidden}.menu-card:after{content:"";position:absolute;width:120px;height:120px;right:-45px;top:-54px;border-radius:50%;background:#c8395d25}.menu-card.locked{filter:saturate(.35);opacity:.68}.card-icon{font-size:29px;display:block;margin-bottom:4px}.menu-card strong{display:block;font-size:16px}.menu-card small{color:#e5bfc8;font-size:12px}.section-head{margin:6px 0 22px}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:12px 0 7px}.progress{height:8px;background:#fff1;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#dc3b63,#ff7997);border-radius:9px;transition:width .35s}.question{font-size:21px;line-height:1.4;margin:27px 0 21px}.choices{display:grid;gap:10px}.choice{background:#ffffff10;box-shadow:none;text-align:left;min-height:56px}.choice.selected{outline:2px solid #ff9db2;background:#81243d}.feedback{margin:18px 0 0;padding:13px;border-radius:13px;background:#ffffff10;font-weight:600}.good{color:var(--good)}.bad{color:var(--bad)}.center{text-align:center}.score-big{font-size:56px;font-weight:700;margin:18px 0 0}.game-board{height:min(62vh,520px);background:#15040b66;border-radius:25px;position:relative;overflow:hidden;border:1px solid #ffffff14}.hud{display:flex;justify-content:space-between;background:#ffffff0c;padding:12px;border-radius:15px;margin:14px 0;font-size:12px}.ball{position:absolute;border-radius:50%;background:radial-gradient(circle at 33% 28%,#fff 0 6%,#f0e2cf 7% 32%,#2c2030 34% 38%,#f7f0e6 40% 58%,#2c2030 60% 65%,#f5ece4 67%);box-shadow:0 6px 14px #0008;animation:pulse .65s ease-in-out infinite}.trap{position:absolute;font-size:40px;filter:drop-shadow(0 3px 5px #0008)}.joke-card,.story-card,.paper{background:linear-gradient(145deg,#5c1428,#3d0c1b);border-radius:24px;padding:25px;box-shadow:var(--shadow);min-height:210px;display:flex;align-items:center;white-space:pre-line;line-height:1.8}.story-card{min-height:270px;align-items:flex-start;font-size:15px}.either{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.either button{min-height:180px;border-radius:23px;background:linear-gradient(145deg,#711a32,#3c0c1a);font-size:19px;font-weight:600;padding:14px;transition:.25s}.either button.chosen{background:linear-gradient(145deg,#c4385d,#7a1830);transform:scale(.96)}.mystery{background:radial-gradient(ellipse at 50% 25%,#781b35 0,transparent 42%),linear-gradient(#18030b,#310916)}.door{font-size:60px;display:block;text-align:center;margin:15px;filter:drop-shadow(0 0 20px #e7527722)}.symbols{display:flex;justify-content:center;gap:8px;margin:25px 0}.symbol{width:45px;height:49px;border:1px dashed #ffffff55;border-radius:12px;display:grid;place-items:center;font-size:23px}.giftbox{font-size:120px;filter:drop-shadow(0 16px 15px #0007);animation:float 2s ease-in-out infinite}.envelope{font-size:85px;animation:enter .5s ease}.paper{background:#fff5ec;color:#562033;text-align:left;min-height:auto;margin-top:-13px;box-shadow:0 12px 25px #0006}.paper p{color:#562033}.notice{background:#ffecf11a;border:1px solid #ffb8c633;padding:14px;border-radius:15px;color:#f3cbd4;font-size:13px;margin:16px 0}.admin-table{font-size:13px}.admin-table section{border-bottom:1px solid #ffffff1a;padding:13px 0}.admin-table b{color:#f2a4b7}@keyframes enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes float{50%{transform:translateY(-10px)}}

</style>
  <style>.letter{transform-origin:top center;animation:letterOut .85s cubic-bezier(.2,.85,.25,1) .28s both}@keyframes letterOut{from{opacity:0;transform:translateY(-85px) scaleY(.25)}to{opacity:1;transform:translateY(0) scaleY(1)}}</style>

<body>
  <main id="app" aria-live="polite"></main>
  <template id="back"><button class="icon-btn back" aria-label="Späť">←</button></template>
  <script>
const app=document.querySelector('#app');
const KEY='preTeba-v2';
const defaultData={name:'',completed:{},quiz:{answers:[],score:null},either:[],game:{best:0,combo:0},readyGift:false,gift:false};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultData), soundOn=true, audioCtx, musicTimer;
const save=()=>{localStorage.setItem(KEY,JSON.stringify(data)); syncRemote();};
// Nastavte vlastný zabezpečený server endpoint (s autentifikáciou) pred nasadením.
async function syncRemote(){const endpoint=window.APP_SYNC_ENDPOINT;if(endpoint)try{await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});}catch(e){console.info('Synchronizácia čaká na pripojenie.');}}
function music(){clearInterval(musicTimer);if(!soundOn)return;audioCtx??=new (window.AudioContext||window.webkitAudioContext)();let i=0,notes=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];musicTimer=setInterval(()=>{if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length]/2;g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.7);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.72)},620)}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shell(content,back){app.innerHTML=`<div class="screen">${back?'<div class="top"><button class="icon-btn back">←</button><span class="brand">PRE TEBA</span><button class="sound">'+(soundOn?'♫':'◌')+'</button></div>':'<div class="top"><span class="brand">PRE TEBA</span><button class="sound">'+(soundOn?'♫':'◌')+'</button></div>'}${content}</div>`;document.querySelector('.sound').onclick=()=>{soundOn=!soundOn;music();renderCurrent()};if(back)document.querySelector('.back').onclick=menu;}
function welcome(){shell(`<section class="hero"><h1>👋 Ahoj!</h1><p class="lead">Ako ťa môžem volať?</p><input class="input" id="name" maxlength="24" placeholder="Napíš svoju prezývku" autofocus><button class="primary" id="continue">POKRAČOVAŤ →</button></section>`);document.querySelector('#continue').onclick=()=>{let n=document.querySelector('#name').value.trim();if(n){data.name=n;save();menu()}}}
const cards=[['🧩','KVÍZ','Ako dobre ma poznáš?','quiz'],['🎮','MINIHRA','Otestuj svoj postreh','game'],['🎲','RANDOM','Priprav sa na najhoršie vtipy.','random'],['⚖️','THIS OR THAT','Vyber si.','either'],['🚪','MYSTERY','Dokážeš zistiť, prečo si tu?','mystery'],['🎁','GIFT 🔒','Dokonči všetko ostatné.','gift']];
function menu(){music();shell(`<section class="section-head"><h1>Ahoj, ${esc(data.name)}! 👋</h1><p>Čo si dnes vyberieš?</p></section><div class="menu-grid">${cards.map(c=>{let lock=c[3]==='gift'&&!data.gift;return `<button class="menu-card ${lock?'locked':''}" data-go="${c[3]}"><span class="card-icon">${c[0]}</span><strong>${c[1]}</strong><small>${c[2]}</small></button>`}).join('')}</div>`);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let x=b.dataset.go;if(x==='gift'&&!data.gift)return giftLock();({quiz,game,random,either,mystery,gift})[x]()});}
const qs=[['Aký šport mám najradšej?',['Futbal','Volejbal','Hokej','Basketbal'],[1]],['Ktoré by som si vybral?',['PS5','PC','Mobil','Všetko naraz'],[2]],['Čo by som si pravdepodobnejšie pozrel?',['Komédia','Horor','Akčný film','Dokument'],[0,2]],['Čo by som si vybral na jeden celý deň?',['Zostať doma','Byť s kamarátmi','Športovať','Robiť niečo úplne náhodné'],[1,2]],['Čo by som pravdepodobne robil o polnoci?',['Spal','Hral hry','Scrolloval na mobile','Premýšľal nad úplnými hlúposťami'],[1,2,3]],['Aká je moja obľúbená farba?',['Červená','Modrá','Fialová','Čierna'],[0]],['Kedy mám narodeniny?',['25. január','14. február','8. máj','30. november'],[0]],['Môj obľúbený alkoholický nápoj?',['Pivo','Víno','Miešaný drink','Nepijem'],[3]],['Na aký hudobný nástroj by som sa najradšej naučil hrať?',['Gitara','Klavír','Bicie','Saxofón'],[1]],['Koho z týchto ľudí mám najradšej?',['Otilia','Katka','Tamara','Lucia'],[1]]];
let quizI=0,quizAns=[];function quiz(){quizI=0;quizAns=[];quizQ()}function quizQ(){let q=qs[quizI];shell(`<div class="section-head"><div class="eyebrow">🧩 Ako dobre ma poznáš?</div><div class="progress-row"><span>Otázka ${quizI+1}/10</span><span>${Math.round(quizI*10)}%</span></div><div class="progress"><i style="width:${quizI*10}%"></i></div></div><h2 class="question">${q[0]}</h2><div class="choices">${q[1].map((a,i)=>`<button class="choice" data-i="${i}">${'ABCD'[i]}) ${a}</button>`).join('')}</div><div id="feedback"></div>`,true);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.i))}function answerQuiz(i){let q=qs[quizI],ok=q[2].includes(i);quizAns.push(i);document.querySelectorAll('.choice').forEach(x=>x.disabled=true);document.querySelector(`[data-i="${i}"]`).classList.add('selected');document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✅ Správne!':'❌ Tentokrát nie.'}</div>`;setTimeout(()=>{quizI++;quizI===10?quizEnd():quizQ()},700)}function quizEnd(){let score=quizAns.reduce((n,a,i)=>n+qs[i][2].includes(a),0);data.quiz={answers:quizAns,score};complete('quiz');shell(`<div class="center"><div class="eyebrow">Kvíz dokončený</div><div class="score-big">${score}/10</div><h2>Tvoje skóre</h2><p>${score>=8?'Poznáš ma až podozrivo dobre. ✨':score>=5?'Dobrá práca, '+esc(data.name)+'!': 'Nabudúce to bude ešte lepšie.'}</p><button class="primary" id="home">SPÄŤ DO MENU</button></div>`,true);document.querySelector('#home').onclick=menu}
function game(){shell(`<div class="section-head"><div class="eyebrow">🎮 POSTREH</div><h1>Ako rýchly máš postreh?</h1><p>Klikni na volejbalovú loptu vždy, keď sa objaví.</p></div><button class="primary" id="start">ZAČAŤ HRAŤ</button>`,true);document.querySelector('#start').onclick=startGame}function startGame(){let score=0,combo=0,best=0,left=20,board;function draw(){shell(`<div class="eyebrow">🎮 POSTREH</div><div class="hud"><span>🏐 Skóre: <b id="score">0</b></span><span>🔥 Combo: <b id="combo">0</b></span><span>⏱️ <b id="time">20</b>s</span></div><div class="game-board" id="board"></div>`,true);board=document.querySelector('#board');spawn()}function spawn(){if(left<=0)return;let trap=Math.random()<.18,sz=Math.max(34,66-score*1.2),el=document.createElement('button');el.className=trap?'trap':'ball';el.textContent=trap?'❌':'';el.style.width=trap?'48px':sz+'px';el.style.height=trap?'48px':sz+'px';el.style.left=(5+Math.random()*78)+'%';el.style.top=(5+Math.random()*77)+'%';el.onclick=()=>{el.remove();if(trap){score=Math.max(0,score-2);combo=0}else{score++;combo++;best=Math.max(best,combo)}document.querySelector('#score').textContent=score;document.querySelector('#combo').textContent=combo;setTimeout(spawn,Math.max(80,310-score*8))};board.append(el)}draw();let timer=setInterval(()=>{left--;let t=document.querySelector('#time');if(t)t.textContent=left;if(left<=0){clearInterval(timer);endGame(score,best)}},1000)}function endGame(score,best){data.game.best=Math.max(data.game.best,score);data.game.combo=Math.max(data.game.combo,best);complete('game');let msg=score<=5?'🐢 Trochu pomalé…':score<=10?'😐 Celkom dobré.':score<=15?'⚡ Rýchle!':'👁️ Čo si zač?!';shell(`<div class="center"><div class="score-big">⚡ KONIEC!</div><p>Tvoje skóre: <b>${score}</b><br>Najlepšie combo: <b>×${best}</b></p><h2>${msg}</h2><button class="primary" id="again">HRAŤ ZNOVA</button><button class="secondary" id="home">SPÄŤ</button></div>`,true);document.querySelector('#again').onclick=startGame;document.querySelector('#home').onclick=menu}
const jokes=['Prečo išiel počítač k doktorovi?\nLebo mal vírus. 💻','Čo povie stena druhej stene?\nStretneme sa na rohu. 🧱','Čo povie Wi‑Fi, keď sa s tebou rozíde?\nNecítim medzi nami spojenie. 📶','Prečo nemôže kostra klamať?\nLebo ju každý prekukne. 💀','Prečo som si dal budík na 7:00?\nAby som ho mohol o 7:00 vypnúť.\nPlán splnený. 😎'];let jokeI=0;function random(){jokeI=0;randomCard()}function randomCard(){let end=jokeI>=jokes.length;shell(`<div class="section-head"><div class="eyebrow">🎲 RANDOM</div><h1>Vitaj v sekcii Random!</h1><p>Tu máš zoznam neuveriteľne zlých vtipov. Veľa šťastia. Budeš ho potrebovať.</p></div><div class="joke-card">${end?'🗑️ Gratulujem.\n\nPráve si venovala svoj drahocenný čas týmto vtipom. Vravel som, že sú strašné. A aj tak si ich dočítala. 😂':jokes[jokeI]}</div><button class="primary" id="next">${end?'SPÄŤ DO MENU':'🎲 ĎALŠÍ'}</button>`,true);document.querySelector('#next').onclick=()=>{if(end){complete('random');menu()}else{jokeI++;randomCard()}}}
const eitherQs=[['More 🌊','Hory 🏔️'],['Hrať hry 🎮','Pozerať film 🎬'],['Pizza 🍕','Burger 🍔'],['Zostať doma 🏠','Ísť celý deň von 🌳'],['Veľa peňazí 💰','Veľa voľného času ⏳'],['Čítať myšlienky 🧠','Vidieť budúcnosť 🔮'],['Bez mobilu mesiac 📵','Bez hier mesiac 🎮'],['Smiať sa nevhodne 😂','Nevedieť sa zasmiať 😐'],['Perfektne spievať 🎤','Perfektne hrať na nástroj 🎹'],['Jedna superschopnosť 🦸','1 000 000 € 💰']];let eitherI=0,eitherAns=[];function either(){eitherI=0;eitherAns=[];eitherQ()}function eitherQ(){if(eitherI===10){data.either=eitherAns;complete('either');shell(`<div class="center"><div class="eyebrow">⚖️ Hotovo</div><h1>Tvoje voľby</h1><p>${eitherAns.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</p><button class="primary" id="home">SPÄŤ DO MENU</button></div>`,true);document.querySelector('#home').onclick=menu;return}let q=eitherQs[eitherI];shell(`<div class="eyebrow">⚖️ THIS OR THAT · ${eitherI+1}/10</div><div class="progress"><i style="width:${eitherI*10}%"></i></div><h1 class="question">Vyber si.</h1><div class="either"><button>${q[0]}</button><button>${q[1]}</button></div>`,true);document.querySelectorAll('.either button').forEach((b,i)=>b.onclick=()=>{b.classList.add('chosen');eitherAns.push(q[i]);setTimeout(()=>{eitherI++;eitherQ()},330)})}
const scenes=[['Otvorila si oči.\n\nNevieš kde si. Pred tebou je dlhá chodba a na jej konci stoja tri dvere.\n\n„Ak chceš zistiť, prečo si tu, musíš pokračovať.“','🚪 Dvere 1','🚪 Dvere 2','🚪 Dvere 3'],['Kuchyňa. Na stole je tanier, pohár a jeden rožok.\n\nRožok sa pohne. „Konečne. Už som si myslel, že neprídeš.“','Toastovač','Pohár vody','Rožok'],['Kino. Na plátne vidíš samu seba. Obraz kopíruje tvoje pohyby.\n\n„Nepozeraj za seba.“','Plné kino','TV so zemiakmi','Prázdna miestnosť'],['Výťah. Tlačidlá 1–5 a jedno: „NEVYBERAJ TOTO.“\n\nGratulujem. Urobila si presne to, čo som ti povedal, aby si nerobila.','Ďalší výťah','Miestnosť s hodinami','Muž v obleku'],['Tajomný odkaz hovorí: „Ešte jedno poschodie.“ Mačka sa na teba pozrie.\n\n„Ak by som vedela, ktorý kľúč potrebuješ, nebola by som mačka.“','Automat','Zrkadlo','Krabice'],['Neznámy telefón zazvoní. „Konečne. Niekto, koho už poznáš.“\n\nStolička vedľa teba zašepká: „Au. Mohla si aspoň zaklopať.“','Telefón','Puzzle','Pôvodná chodba'],['Muž v obleku čaká pri posledných dverách. „Celý čas si si myslela, že hľadáš cestu von. Ale to nebol cieľ.“','❤️ SPOMIENKA','😂 PREKVAPENIE','🚪 KONIEC']];let mysteryStep=0;function mystery(){mysteryStep=0;mysteryScene()}function mysteryScene(){if(mysteryStep>=scenes.length){complete('mystery');shell(`<div class="mystery center"><span class="door">🚪</span><div class="eyebrow">FINÁLE</div><h1>PRETOŽE SI SA NEMALA VZDÁVAŤ.</h1><p>Možno si čakala obrovské tajomstvo… ale teraz už vieš, že to celé bola jedna veľká blbosť. Dúfam, že ťa aspoň pobavila. ❤️</p><button class="primary" id="again">ZAHRAŤ ZNOVA</button><button class="secondary" id="home">SPÄŤ DO MENU</button></div>`,true);document.querySelector('#again').onclick=mystery;document.querySelector('#home').onclick=menu;return}let s=scenes[mysteryStep];shell(`<div class="mystery"><div class="eyebrow">🚪 MYSTERY · ${mysteryStep+1}/${scenes.length}</div><span class="door">🚪</span><div class="story-card">${s[0]}</div><div class="choices" style="margin-top:16px">${s.slice(1).map(x=>`<button class="choice">${x}</button>`).join('')}</div></div>`,true);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{mysteryStep++;mysteryScene()})}
function complete(k){data.completed[k]=new Date().toISOString();if(['quiz','game','random','either','mystery'].every(x=>data.completed[x])&&!data.gift){data.readyGift=true;setTimeout(()=>alert('Máš všetky časti. Teraz už zostáva iba zistiť, čo znamenajú.'),100)}save()}
function giftLock(){let all=['quiz','game','random','either','mystery'].every(x=>data.completed[x]),order=['🔑','⭐','❤️','🦋','🌙'];if(!all){shell(`<div class="center"><div class="giftbox">🔒</div><h1>Ešte nie.</h1><p>Dokonči všetko ostatné a darček sa odomkne.</p><div class="symbols">${['quiz','game','random','either','mystery'].map(x=>`<span class="symbol">${data.completed[x]?({quiz:'🔑',game:'⭐',random:'❤️',either:'🦋',mystery:'🌙'})[x]:'?'}</span>`).join('')}</div></div>`,true);return}let picked=[];const render=()=>{shell(`<div class="center"><div class="eyebrow">Posledný krok</div><h1>Poskladaj symboly</h1><p>Máš všetky časti. Teraz už zostáva iba zistiť, čo znamenajú.</p><div class="symbols">${[0,1,2,3,4].map((_,i)=>`<span class="symbol">${picked[i]||'?'}</span>`).join('')}</div><div class="choices">${order.map(s=>`<button class="choice" data-symbol="${s}" ${picked.includes(s)?'disabled':''}>${s}</button>`).join('')}</div><div id="hint"></div></div>`,true);document.querySelectorAll('[data-symbol]').forEach(b=>b.onclick=()=>{picked.push(b.dataset.symbol);if(picked.length===5){if(picked.join('')===order.join('')){data.gift=true;data.readyGift=false;save();gift()}else{picked=[];render();document.querySelector('#hint').innerHTML='<div class="feedback bad">Skús to ešte raz.</div>'}}else render()})};render()}
function gift(){shell(`<div class="center"><div class="eyebrow">🎁 GIFT</div><div class="giftbox">🎁</div><button class="primary" id="open">OTVORIŤ</button></div>`,true);document.querySelector('#open').onclick=()=>{shell(`<div class="center"><div class="envelope">✉️</div><h2>Tvoj darček je… nič. 🙃</h2><p>Robím si srandu. 😂</p><article class="paper letter"><p>Ďakujem, že si si dala čas prejsť celú túto blbosť. 😂<br><br>Dúfam, že ťa to aspoň trochu pobavilo a že si sa pri tom nenudila.<br><br>Darček ti dám osobne.<br><br><i>(Určite už viem, čo to bude 😎)</i><br><br>Ešte raz ďakujem. 🫶</p></article><button class="secondary" id="home">SPÄŤ DO MENU</button></div>`,true);document.querySelector('#home').onclick=menu}}
function admin(){let pin=prompt('PIN administrátora:');if(pin!=='d1234')return;let answers=data.quiz.answers.map((x,i)=>`${i+1}. ${'ABCD'[x]||'–'}`).join('<br>');shell(`<div class="eyebrow">Súkromné výsledky</div><h1>Admin panel</h1><div class="admin-table"><section><b>PREZÝVKA</b><br>${esc(data.name)||'–'}</section><section><b>KVÍZ</b><br>${data.quiz.score??'–'}/10<br>${answers}</section><section><b>THIS OR THAT</b><br>${data.either.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>')||'–'}</section><section><b>MINIHRA</b><br>Najlepšie skóre: ${data.game.best}<br>Najlepšie combo: ×${data.game.combo}</section><section><b>MYSTERY</b><br>Dokončené: ${data.completed.mystery?'Áno':'Nie'}</section><section><b>GIFT</b><br>Odomknutý: ${data.gift?'Áno':'Nie'}</section></div>`,true)}
let taps=0;app.addEventListener('click',e=>{if(e.target.classList.contains('brand')){if(++taps===5){taps=0;admin()}setTimeout(()=>taps=0,1200)}});function renderCurrent(){data.name?menu():welcome()}renderCurrent();

</script>
</body>
